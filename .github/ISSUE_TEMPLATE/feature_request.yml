name: Feature Request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个需求来自什么痛点或使用场景？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望怎么实现？
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 其他备选方案
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围（可多选）
      options:
        - label: 仅影响 UI / 视觉
        - label: 影响自定义 / 配置数据格式
        - label: 影响构建 / 部署流程
        - label: 涉及新的第三方依赖
